name: Lean proof check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: false
          build: true
      - name: Check axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Lemniscate/AxiomAudit.lean > axiom-audit.log
          cat axiom-audit.log
          python3 scripts/check_axioms.py axiom-audit.log
