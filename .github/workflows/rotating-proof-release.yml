name: Preserve verified rotating-profile proofs
on:
  push:
    branches: [research/remaining-open-problems]
    paths:
      - OpenProblems/SolitonClassification/VerifiedRotatingProfiles/origins.json
      - OpenProblems/SolitonClassification/VerifiedRotatingProfiles/publish.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-rotating-closed-profiles-2026-11-20-v1
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: OpenProblems/SolitonClassification/VerifiedRotatingProfiles
      - name: Check origin runs and copy twelve original ZIPs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B OpenProblems/SolitonClassification/VerifiedRotatingProfiles/publish.py
      - name: Retain the release readback
        uses: actions/upload-artifact@v4
        with:
          name: verified-rotating-profile-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rotating-release-readback.json
          if-no-files-found: error
          retention-days: 30
