name: Check the complete rotating-profile candidate
on:
  workflow_dispatch:
  push:
    branches: [research/remaining-open-problems]
    paths: [.github/workflows/rotating-full-candidate.yml]
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SC: OpenProblems/SolitonClassification
jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        batch: ['00', '01', '02', '03', '04', '05', '06', '07', '08']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            OpenProblems/SolitonClassification/FullCandidateExecution
            OpenProblems/SolitonClassification/OriginalArchives246/requests
            OpenProblems/SolitonClassification/FullAssemblyTools
            OpenProblems/SolitonClassification/ProductionPipeline/plan
      - name: Build public projections from original release assets
        env:
          BATCH: ${{ matrix.batch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B "$SC/FullAssemblyTools/tools/verify_full_assembly_tools_package.py" --package "$SC/FullAssemblyTools" --inventory-sha256 e7502fbabbbf9116c1c03c783e8b07f5cbac04009356c9e5266f524895097d24 --report "$RUNNER_TEMP/assembly-tools-check.json"
          python3 -B "$SC/FullCandidateExecution/full250.py" --tools "$SC/FullAssemblyTools/tools" project --batch "$BATCH" --requests "$SC/OriginalArchives246/requests" --records "$SC/FullCandidateExecution/records" --index "$SC/FullCandidateExecution/index.json" --plan "$SC/ProductionPipeline/plan/plan.json" --out "$RUNNER_TEMP/batch$BATCH"
      - uses: actions/upload-artifact@v4
        with:
          name: batch${{ matrix.batch }}
          path: ${{ runner.temp }}/batch${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  assemble:
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            OpenProblems/SolitonClassification/FullCandidateExecution
            OpenProblems/SolitonClassification/OriginalArchives246/requests
            OpenProblems/SolitonClassification/FullAssemblyTools
            OpenProblems/SolitonClassification/ProductionPipeline
            OpenProblems/SolitonClassification/ModuleProduction
            OpenProblems/SolitonClassification/FinalSources
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: OpenProblems/SolitonClassification/ModuleProduction
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/download-artifact@v4
        with:
          pattern: batch*
          path: ${{ runner.temp }}/parts
          merge-multiple: false
      - name: Restore the original core and select the exact original Linux 48-module output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B "$SC/FullAssemblyTools/tools/verify_full_assembly_tools_package.py" --package "$SC/FullAssemblyTools" --inventory-sha256 e7502fbabbbf9116c1c03c783e8b07f5cbac04009356c9e5266f524895097d24 --report "$RUNNER_TEMP/assembly-tools-check.json"
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free>=14*1024**3,"Need 14 GiB free for core and assembly"'
          gh api -H "Accept: application/octet-stream" "/repos/$GITHUB_REPOSITORY/releases/assets/742149339" > "$RUNNER_TEMP/core.tar.xz"
          lean_bin="$(cd "$SC/ModuleProduction" && elan which lean)"
          python3 -B "$SC/FullAssemblyTools/tools/production_core_artifact.py" restore --archive "$RUNNER_TEMP/core.tar.xz" --output "$RUNNER_TEMP/restored" --sha256 01110125281c6f4e7ea42061adf5637a6331b521ca434e846b832f1b2c7dbc8c --revision cff971bcac7ac2d83aba04596ce09e44fda1ac29 --lean "$lean_bin"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/14007325855/zip" > "$RUNNER_TEMP/final48.zip"
          echo "4664358fbe4b3a93edd5462626b85ba189bd0e43276a0345fb03ce1893eb1378  $RUNNER_TEMP/final48.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/final48.zip" 'final48/*' -d "$RUNNER_TEMP/original48"
      - name: Merge all 250 signed shards and run the Lean kernel on the full candidate
        run: |
          set -euo pipefail
          python3 -B "$SC/FullCandidateExecution/full250.py" --tools "$SC/FullAssemblyTools/tools" merge --mode full --publication-revision "$GITHUB_SHA" --plan "$SC/ProductionPipeline/plan/plan.json" --records "$SC/FullCandidateExecution/records" --index "$SC/FullCandidateExecution/index.json" --requests "$SC/OriginalArchives246/requests" --parts "$RUNNER_TEMP/parts" --base "$RUNNER_TEMP/restored/base_lock.json" --out "$RUNNER_TEMP/fullmerge"
          python3 -B "$SC/FullCandidateExecution/full250.py" --tools "$SC/FullAssemblyTools/tools" assemble --merge "$RUNNER_TEMP/fullmerge" --pipeline "$SC/ProductionPipeline" --core-project "$SC/ModuleProduction" --final-package "$SC/FinalSources" --final-output "$RUNNER_TEMP/original48/final48" --restored "$RUNNER_TEMP/restored" --out "$RUNNER_TEMP/assembly"
      - name: Retain assembled proof, compiler report, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotating-full-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/assembly-tools-check.json
            ${{ runner.temp }}/fullmerge/ledger.json
            ${{ runner.temp }}/fullmerge/merge_pins.json
            ${{ runner.temp }}/fullmerge/merged/merge_receipt.json
            ${{ runner.temp }}/assembly/*.json
            ${{ runner.temp }}/assembly/validation_before/*.json
            ${{ runner.temp }}/assembly/validation_after/*.json
            ${{ runner.temp }}/assembly/compiled/checked/
            ${{ runner.temp }}/assembly/compiled/logs/
            ${{ runner.temp }}/assembly/compiled/source/
            ${{ runner.temp }}/assembly/compiled/setups/
            ${{ runner.temp }}/assembly/compiled/*.json
          retention-days: 30
          if-no-files-found: warn
